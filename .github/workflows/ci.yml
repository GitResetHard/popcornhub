name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: moviestrackr_next_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # The integration tests truncate tables, so they run against a dedicated database.
      DATABASE_URL: mysql://root@127.0.0.1:3306/moviestrackr_next_test
      AUTH_SECRET: ci-secret-key-for-tests-not-real

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Load schema
        # Drizzle's `--> statement-breakpoint` markers are rejected by MySQL 8, so strip them.
        run: sed 's/--> statement-breakpoint//' drizzle/0000_initial.sql | mysql -h 127.0.0.1 -u root moviestrackr_next_test

      - run: npm run types

      - run: npm run lint

      - run: npm test

      - run: npm run build
