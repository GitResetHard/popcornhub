name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moviestrackr_next_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # The integration tests truncate tables, so they run against a dedicated database.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/moviestrackr_next_test
      AUTH_SECRET: ci-secret-key-for-tests-not-real

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Load schema
        # Drizzle's `--> statement-breakpoint` markers are SQL comments in Postgres, so psql
        # ignores them and the file loads as-is.
        run: psql "$DATABASE_URL" -f drizzle/0000_initial.sql

      - run: npm run types

      - run: npm run lint

      - run: npm test

      - run: npm run build
